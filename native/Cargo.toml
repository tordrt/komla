[package]
name = "komla"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.85"

[dependencies]
anyhow = "=1.0.95"
base64 = "=0.22.1"
getrandom = { version = "=0.2.17", features = ["std"] }
ignore = "=0.4.23"
jiff = { version = "=0.2.15", default-features = false, features = ["std", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
notify = "=7.0.0"
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "perf", "syntax", "meta", "nfa", "hybrid", "unicode-case", "unicode-perl", "unicode-word-boundary"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
sha2 = "=0.10.8"

[target.'cfg(unix)'.dependencies]
# Phone access (`src/remote_control`): the remote-control protocol's P-256, HKDF and AES-GCM, and
# a WebSocket server.
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
hkdf = "=0.12.4"
libc = "=0.2.189"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
tungstenite = { version = "=0.24.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "=3.14.0"

# On top of clippy's defaults. `npm run lint:native` fails on any warning.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Six of these binaries ship in every installer and upload to SSH hosts.
[profile.release]
strip = true
lto = true
codegen-units = 1
