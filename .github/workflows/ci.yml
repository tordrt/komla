name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's push cancels its run in progress. main's runs finish instead, so it shows red
# when it is: main gets pushes minutes apart, and cancelling there left most runs unfinished and a
# failing platform unnoticed for days. A run waiting behind main's is still replaced by the newer
# push, so main runs one at a time, on its newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A full run takes about 16 minutes on Windows, the slowest; a hung test
    # would otherwise hold the runner for GitHub's 6-hour limit.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # .npmrc's min-release-age needs npm 11.
      - run: npm install -g npm@11
      # keyboard-layout's native build needs the X11 and xkbfile headers.
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev
        if: runner.os == 'Linux'
      - run: npm ci
      - run: npm run format:check
        if: runner.os == 'Linux'
      - run: npm run format:native:check
        if: runner.os == 'Linux'
      - run: npm run lint
        if: runner.os == 'Linux'
      # On every OS: parts of the native crate compile only on Unix or Windows.
      - run: npm run lint:native
      # Typechecks, then runs vitest and the native Rust tests.
      - run: npm test
      # The phone web app, the protocol package it shares with the desktop app, and the SDK.
      - run: npm --workspace komla-remote-web test && npm --workspace @komla/remote-protocol test && npm --workspace @komla/sdk test
        if: runner.os == 'Linux'
