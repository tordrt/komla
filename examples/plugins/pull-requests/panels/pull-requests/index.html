<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pull requests</title>
    <link rel="stylesheet" href="/__komla/komla.css" />
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header class="k-header">
      <div class="k-toolbar">
        <label class="k-search">
          <span class="k-icon" aria-hidden="true">&#xea6d;</span>
          <input id="filter" class="k-input" type="search" placeholder="Filter pull requests" aria-label="Filter pull requests" />
        </label>
        <button id="refresh" class="k-icon-button" title="Ask GitHub again" aria-label="Ask GitHub again">
          <span class="k-icon">&#xeb37;</span>
        </button>
      </div>
      <div class="k-meta">
        <span class="k-icon" aria-hidden="true">&#xea64;</span>
        <a id="repo" class="k-link k-truncate" href="#">Pull requests</a>
        <span id="updated"></span>
      </div>
    </header>
    <div id="notice" class="k-banner" role="status" hidden></div>
    <main id="lists">
      <div class="loading k-stack" aria-label="Loading">
        <div class="k-row"><span class="k-skeleton dot"></span><span class="k-skeleton k-grow"></span></div>
        <div class="k-row"><span class="k-skeleton dot"></span><span class="k-skeleton short"></span></div>
        <div class="k-row"><span class="k-skeleton dot"></span><span class="k-skeleton k-grow"></span></div>
      </div>
    </main>
  </body>
</html>
